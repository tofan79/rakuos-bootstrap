name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Dependensi ada di vendor/ (lihat .cargo/config.toml), jadi offline.
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --offline
      - name: Test
        run: cargo test --offline
      - name: Build release
        run: cargo build --release --offline
