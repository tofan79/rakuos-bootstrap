# ------------------------------------------------------------------- login ---
# Empat greeter resmi rakuos-hyprland. Perilaku paket dan config-nya diambil
# dari `system_files/usr/libexec/rakuos-hyprland-greeter`; UI-nya tidak.
[[logins]]
id = "dms-greeter"
name = "DMS Greeter"
description = "Greeter Dux (greetd), quickshell, ikut compositor"
packages = ["greetd", "dms-greeter"]
unit = "greetd.service"
greetd_cmd = "/usr/bin/dms-greeter --command @COMPOSITOR@"
greetd_user = "greeter"

[[logins]]
id = "gdm"
name = "GDM"
description = "GNOME Display Manager, bisa memilih sesi Wayland"
packages = ["gdm"]
unit = "gdm.service"

[[logins]]
id = "noctalia-greeter"
name = "Noctalia Greeter"
description = "Greeter Noctalia (greetd, wlroots)"
packages = ["greetd", "noctalia-greeter"]
unit = "greetd.service"
greetd_cmd = "/usr/bin/noctalia-greeter-session"
greetd_user = "greeter"
greetd_setup = "/usr/share/noctalia-greeter/setup_greeter_system.sh"
default = true

[[logins]]
id = "plasma-login"
name = "Plasma Login"
description = "Login KDE Plasma (Wayland), bisa memilih sesi Wayland"
packages = ["plasma-login-manager"]
unit = "plasmalogin.service"

[[logins]]
id = "sddm"
name = "SDDM"
description = "SDDM X11, tema Maldives, fallback grafis"
packages = ["sddm-x11", "sddm-themes"]
no_recommends = ["sddm-x11"]
unit = "sddm.service"
sddm_theme = "maldives"

[[logins]]
id = "sysc-greet"
name = "sysc-greet"
description = "Greeter TUI console di cagebreak"
packages = ["sysc-greet"]
no_recommends = ["sysc-greet"]
unit = "greetd.service"
greetd_cmd = "cagebreak -e -c /etc/greetd/cagebreak-greeter-config"
greetd_user = "greeter"

# Dipakai otomatis saat Desktop = KineticWE (lihat login_override di atas).
# Tidak ditampilkan karena paketnya Requires kineticwe-git.
[[logins]]
id = "kineticwe-greeter"
name = "KineticWE Greeter"
description = "Greeter Noctalia bawaan KineticWE (greetd, wlroots)"
packages = ["kineticwe-greeter"]
unit = "greetd.service"
greetd_cmd = "/usr/bin/noctalia-greeter-session"
greetd_user = "greeter"
greetd_setup = "/usr/share/noctalia-greeter/setup_greeter_system.sh"
hidden = true

[[logins]]
id = "none"
name = "Tanpa login manager"
description = "Autologin user langsung ke desktop di tty1"
packages = ["dbus-daemon"]
available = false
hidden = true
