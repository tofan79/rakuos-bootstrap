# Katalog rakuos-bootstrap.
#
# Menambah/mengubah pilihan cukup edit file ini; binary tidak perlu di-rebuild.
# `available = false` menyembunyikan pilihan dari daftar (belum ada paketnya).
# `default = true` menentukan pilihan yang disorot saat fase dibuka.
#
# Urutan tampilan selalu A-Z (diurutkan ulang oleh kode), jadi urutan di file
# ini tidak menentukan urutan di layar. Tetap ditulis A-Z supaya enak dibaca.
#
# Semua paket di bawah sudah dicek ada di Fedora 45 atau repo RakuOS 45
# (2026-10-26). Lihat PLAN.md bagian 5 untuk catatan verifikasi.

# Repo pihak ketiga yang diaktifkan sebelum paket dipasang.
#
# Image RakuOS membawa Terra dan RPM Fusion dalam keadaan nonaktif. Wizard
# menyalakannya hanya kalau user memintanya, dengan cara yang sama seperti
# halaman "Third-Party Repositories" di rakuos-welcome:
#   terra     -> `rum config-manager --set-enabled terra`
#   rpmfusion -> id yang tercatat di /usr/share/rakuos/rpmfusion-default-repos,
#                fallback `rpmfusion-*`
# Kosongkan daftar ini kalau tidak ingin repo pihak ketiga disentuh.
repos = ["terra", "rpmfusion"]

# Lapisan dasar: selalu dipasang, apa pun pilihan user.
base = [
    "pipewire",
    "pipewire-pulseaudio",
    "wireplumber",
    "mesa-dri-drivers",
    "mesa-vulkan-drivers",
    "libva",
    "polkit",
    "lxpolkit",
    "xdg-desktop-portal",
    "xdg-desktop-portal-gtk",
    "dbus-tools",
    "default-fonts",
    "google-noto-sans-fonts",
    "google-noto-color-emoji-fonts",
    "fuzzel",
    "gvfs",
    "gvfs-mtp",
]

# ---------------------------------------------------------------- terminal ---
[[terminals]]
id = "alacritty"
name = "Alacritty"
description = "GPU-accelerated, konfigurasi YAML sederhana"
packages = ["alacritty"]

[[terminals]]
id = "foot"
name = "Foot"
description = "Ringan, Wayland-only, cocok untuk sistem minimal"
packages = ["foot", "foot-terminfo"]

[[terminals]]
id = "ghostty"
name = "Ghostty"
description = "Dari repo Terra, diaktifkan otomatis saat instalasi"
packages = ["ghostty", "ghostty-terminfo", "ghostty-shell-integration"]

[[terminals]]
id = "kitty"
name = "Kitty"
description = "GPU-accelerated, paling umum dipakai di Hyprland"
packages = ["kitty", "kitty-kitten", "kitty-shell-integration", "kitty-terminfo"]
default = true

# ----------------------------------------------------------------- browser ---
[[browsers]]
id = "brave"
name = "Brave (RPM)"
description = "Dari repo RakuOS, pemblokir iklan bawaan"
packages = ["brave-browser"]

[[browsers]]
id = "chromium"
name = "Chromium (RPM)"
description = "Native RPM, tanpa sinkronisasi akun Google"
packages = ["chromium"]

[[browsers]]
id = "firefox-rpm"
name = "Firefox (RPM)"
description = "Native RPM lewat overlay, tanpa sandbox Flatpak"
packages = ["firefox"]
default = true

# ----------------------------------------------------------------- desktop ---
[[desktops]]
id = "hyprland"
name = "Hyprland"
description = "Tiling dinamis, config minimal tanpa bar"
packages = ["hyprland", "hyprland-uwsm", "xdg-desktop-portal-hyprland"]
skel = "hyprland"
autologin_cmd = "Hyprland"
default = true

[[desktops]]
id = "labwc"
name = "Labwc"
description = "Stacking compositor ringan (ala Openbox), tanpa config tambahan"
packages = ["labwc"]
autologin_cmd = "labwc"

[[desktops]]
id = "mangowm"
name = "MangoWM"
description = "Belum dipaketkan untuk Fedora/RakuOS"
available = false

[[desktops]]
id = "niri"
name = "Niri"
description = "Scrollable tiling, config minimal tanpa bar"
packages = ["niri"]
skel = "niri"
autologin_cmd = "niri-session"

# ------------------------------------------------------------ file manager ---
[[file_managers]]
id = "dolphin"
name = "Dolphin"
description = "File manager KDE, fitur lengkap (menarik Qt/KDE stack)"
packages = ["dolphin"]

[[file_managers]]
id = "hyprfm"
name = "HyprFM"
description = "Keyboard-first untuk Hyprland, dari repo RakuOS"
packages = ["hyprfm"]

[[file_managers]]
id = "nautilus"
name = "Nautilus"
description = "File manager GNOME, ringan untuk pemakaian dasar"
packages = ["nautilus"]
default = true

[[file_managers]]
id = "nemo"
name = "Nemo"
description = "File manager Cinnamon, GTK3, dukungan gvfs-fuse"
packages = ["nemo"]

[[file_managers]]
id = "superfile"
name = "Superfile"
description = "File manager TUI modern (binary spf), dari repo Terra"
packages = ["superfile"]

[[file_managers]]
id = "thunar"
name = "Thunar"
description = "File manager Xfce, ringan dan cepat"
packages = ["Thunar", "thunar-volman"]

[[file_managers]]
id = "yazi"
name = "Yazi"
description = "File manager TUI cepat, dari repo Terra"
packages = ["yazi"]

# ------------------------------------------------------------------- login ---
[[logins]]
id = "greetd-tuigreet"
name = "greetd + tuigreet"
description = "Greeter TUI paling ringan, cocok untuk Wayland minimal"
packages = ["greetd", "tuigreet"]
unit = "greetd.service"
default = true

[[logins]]
id = "ly"
name = "Ly"
description = "Display manager TUI, ringan"
packages = ["ly"]
unit = "ly.service"

[[logins]]
id = "sddm"
name = "SDDM"
description = "Display manager grafis, paling familiar"
packages = ["sddm"]
unit = "sddm.service"

[[logins]]
id = "none"
name = "Tanpa login manager"
description = "Autologin user langsung ke desktop di tty1"
