packages = ["qutebrowser"]

[[browsers]]
id = "vivaldi"
name = "Vivaldi"
description = "Feature-rich and proprietary"
packages = ["vivaldi-stable"]
command = "vivaldi-stable"

[[browsers]]
id = "waterfox"
name = "Waterfox"
description = "Firefox fork focused on privacy"
packages = ["waterfox"]

[[browsers]]
id = "zen-browser"
name = "Zen Browser"
description = "Firefox-based browser with vertical tabs and workspaces"
packages = ["zen-browser"]

# ----------------------------------------------------------------- desktop ---
[[desktops]]
id = "budgie"
name = "Budgie"
description = "Modern traditional desktop with Wayland support through Budgie Labwc"
packages = ["@budgie-desktop"]
autologin_cmd = "startbudgielabwc"
choose_login = true
default = true

[[desktops]]
id = "hyprland"
name = "Hyprland"
description = "Dynamic-tiling compositor with smooth animations; no panel, highly customizable"
packages = ["hyprland", "hyprland-guiutils", "hyprland-uwsm", "xdg-desktop-portal-hyprland", "hyprland-preview-share-picker"]
session_file = "hyprland-uwsm.desktop"
autologin_cmd = "Hyprland"
choose_login = true

[[desktops]]
id = "kineticwe"
name = "KineticWE"
description = "KWin-based tiling desktop with the Noctalia shell"
packages = ["kineticwe"]
login_override = "kineticwe-greeter"
autologin_cmd = "start-kineticwe"

[[desktops]]
id = "lxqt"
name = "LXQt"
description = "Lightweight desktop with a Wayland session through Miriway"
packages = ["@lxqt-desktop"]
autologin_cmd = "startlxqtwayland"

[[desktops]]
id = "mangowm"
name = "MangoWM"
description = "Lightweight dwl-based tiling compositor with a bundled minimal configuration"
packages = ["mangowm", "scenefx", "wlroots", "xcb-util-wm", "xdg-desktop-portal-wlr", "slurp"]
skel = "mango"
autologin_cmd = "mango"
choose_login = true

[[desktops]]
id = "miraclewm"
name = "MiracleWM"
description = "Wayland compositor with a familiar desktop workflow and tiling"
packages = ["@miraclewm-desktop"]
login_override = "miraclewm-sddm"

[[desktops]]
id = "sway"
name = "Sway"
description = "i3-compatible tiling Wayland compositor, configured with a plain text file"
packages = ["@swaywm"]
autologin_cmd = "sway"
choose_login = true

[[desktops]]
id = "umbriel"
name = "Umbriel"
description = "Lightweight Wayland compositor with a customizable shell"
packages = ["umbriel-git", "noctalia"]
skel = "umbriel"
login_override = "noctalia-greeter"
autologin_cmd = "start-umbriel"

# ------------------------------------------------------------ file manager ---
[[file_managers]]
id = "dolphin"
name = "Dolphin"
description = "KDE file manager with full features (pulls in the Qt/KDE stack)"
packages = ["dolphin"]

[[file_managers]]
id = "hyprfm"
name = "HyprFM"
description = "Keyboard-driven file manager designed for Wayland compositors"
packages = ["hyprfm"]

[[file_managers]]
id = "nautilus"
name = "Nautilus"
description = "GNOME file manager; lightweight for everyday use"
packages = ["nautilus"]
default = true

[[file_managers]]
id = "nemo"
name = "Nemo"
description = "Cinnamon file manager, GTK 3, with gvfs-fuse support"
packages = ["nemo"]

[[file_managers]]
id = "superfile"
name = "Superfile"
description = "Modern terminal file manager with a keyboard-driven interface"
packages = ["superfile"]
command = "spf"

[[file_managers]]
id = "thunar"
name = "Thunar"
description = "Xfce file manager; lightweight and fast"
packages = ["Thunar", "thunar-volman"]

[[file_managers]]
id = "yazi"
name = "Yazi"
description = "Fast terminal file manager with image previews and plugins"
packages = ["yazi"]

# ------------------------------------------------------------------- login ---
# Pilihan login hanya ditawarkan untuk desktop dengan `choose_login = true`
# (Budgie, Hyprland, MangoWM, Sway). Desktop lain memakai login bawaannya
# sendiri atau login yang ditetapkan katalog.
# Empat greeter resmi rakuos-hyprland. Perilaku paket dan config-nya diambil
# dari `system_files/usr/libexec/rakuos-hyprland-greeter`; UI-nya tidak.
[[logins]]
id = "dms-greeter"
name = "DMS Greeter"
description = "Dux greeter (greetd, Quickshell); follows the selected compositor"
packages = ["greetd", "dms-greeter"]
unit = "greetd.service"
greetd_cmd = "/usr/bin/dms-greeter --command @COMPOSITOR@"
greetd_user = "greeter"

[[logins]]
id = "noctalia-greeter"
name = "Noctalia Greeter"
description = "Noctalia greeter (greetd, wlroots)"
packages = ["greetd", "noctalia-greeter"]
unit = "greetd.service"
greetd_cmd = "/usr/bin/noctalia-greeter-session"
greetd_user = "greeter"
greetd_setup = "/usr/share/noctalia-greeter/setup_greeter_system.sh"

[[logins]]
id = "sddm"
name = "SDDM"
description = "SDDM on Wayland (Miriway greeter, as used by Budgie/LXQt); default theme"
# Varian greeter: `sddm-x11` (X11) atau `sddm-wayland-miriway` (Wayland,
# compositor miriway). Dipakai varian Wayland karena itu yang dipakai image
# Budgie/LXQt RakuOS, jadi jalur login yang paling teruji di distro ini.
# Keduanya saling bertentangan (Provides: sddm-greeter-displayserver), jadi
# hanya satu yang boleh terpasang. Tanpa `sddm_theme`: SDDM memakai tema
# bawaannya sendiri.
packages = ["sddm-wayland-miriway"]
unit = "sddm.service"
default = true

# Grup MiracleWM memasang sddm-wayland-miraclewm. Pakai unit SDDM tanpa
# memasang varian greeter lain; sesi Miracle dan greeter disediakan grup itu.
[[logins]]
id = "miraclewm-sddm"
name = "SDDM for MiracleWM"
description = "Wayland SDDM from the Fedora MiracleWM desktop group"
packages = []
unit = "sddm.service"
hidden = true

[[logins]]
id = "sysc-greet"
name = "sysc-greet"
description = "Terminal greeter running in cagebreak"
packages = ["sysc-greet"]
no_recommends = ["sysc-greet"]
unit = "greetd.service"
greetd_cmd = "cagebreak -e -c /etc/greetd/cagebreak-greeter-config"
greetd_user = "greeter"

# Dipakai otomatis oleh desktop dengan `login_override` di atas.
# Tidak ditampilkan sebagai pilihan login.
[[logins]]
id = "kineticwe-greeter"
name = "KineticWE Greeter"
description = "Built-in KineticWE Noctalia greeter (greetd, wlroots)"
packages = ["kineticwe-greeter"]
unit = "greetd.service"
greetd_cmd = "/usr/bin/noctalia-greeter-session"
greetd_user = "greeter"
greetd_setup = "/usr/share/noctalia-greeter/setup_greeter_system.sh"
hidden = true

[[logins]]
id = "none"
name = "No login manager"
description = "Automatically sign in to the desktop on tty1"
packages = ["dbus-daemon"]
available = false
hidden = true
