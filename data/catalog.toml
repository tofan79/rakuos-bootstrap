# Katalog rakuos-bootstrap.
#
# Menambah/mengubah pilihan cukup edit file ini; binary tidak perlu di-rebuild.
# `available = false` menyembunyikan pilihan dari daftar (belum ada paketnya).
# `default = true` menentukan pilihan yang disorot saat fase dibuka.
#
# Urutan tampilan selalu A-Z (diurutkan ulang oleh kode), jadi urutan di file
# ini tidak menentukan urutan di layar. Tetap ditulis A-Z supaya enak dibaca.
#
# Semua paket di bawah sudah dicek ada di Fedora 45 atau repo RakuOS 45
# (2026-10-26).

# Repo pihak ketiga yang diaktifkan sebelum paket dipasang.
#
# Image RakuOS membawa Terra dan RPM Fusion dalam keadaan nonaktif. Wizard
# menyalakannya hanya kalau user memintanya, dengan cara yang sama seperti
# halaman "Third-Party Repositories" di rakuos-welcome:
#   terra     -> `rum config-manager --set-enabled terra`
#   rpmfusion -> id yang tercatat di /usr/share/rakuos/rpmfusion-default-repos,
#                fallback `rpmfusion-free` + `rpmfusion-nonfree`
#   mindset   -> COPR `mindset/Mindset-Apps` (`framework` + `umbriel-git`)
# KineticWE mengecualikan COPR Mindset-Apps dan mengaktifkan
# `theblackdon/kwee` secara khusus.
# Kosongkan daftar ini kalau tidak ingin repo pihak ketiga disentuh.
repos = ["terra", "rpmfusion", "mindset"]

# Lapisan dasar: selalu dipasang, apa pun pilihan user.
base = [
    "dbus-tools",
    "egl-wayland",
    "qt6-qtsvg",
    "qt6-qtwayland",
    "rakuos-software-gtk",
    "rakuos-system-gtk",
    "rakuos-welcome-gtk",
]

# ---------------------------------------------------------------- terminal ---
[[terminals]]
id = "alacritty"
name = "Alacritty"
description = "GPU-accelerated with a simple YAML configuration"
packages = ["alacritty"]

[[terminals]]
id = "foot"
name = "Foot"
description = "Lightweight, Wayland-only, ideal for minimal systems"
packages = ["foot", "foot-terminfo"]

[[terminals]]
id = "ghostty"
name = "Ghostty"
description = "Fast, modern terminal emulator with GPU acceleration"
packages = ["ghostty", "ghostty-terminfo", "ghostty-shell-integration"]

[[terminals]]
id = "kitty"
name = "Kitty"
description = "GPU-accelerated and commonly used with Hyprland"
packages = ["kitty", "kitty-kitten", "kitty-shell-integration", "kitty-terminfo"]
default = true

