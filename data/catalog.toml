packages = ["chromium"]

[[browsers]]
id = "epiphany"
name = "Epiphany"
description = "GNOME Web (WebKitGTK), lightweight"
packages = ["epiphany"]

[[browsers]]
id = "falkon"
name = "Falkon"
description = "Lightweight Qt/Chromium browser for minimal systems"
packages = ["falkon"]

[[browsers]]
id = "firefox"
name = "Firefox"
description = "Default browser; fast and widely compatible"
packages = ["firefox"]
default = true

[[browsers]]
id = "google-chrome"
name = "Google Chrome"
description = "Proprietary, with Google account sync"
packages = ["google-chrome-stable"]
command = "google-chrome-stable"

[[browsers]]
id = "helium"
name = "Helium"
description = "Chromium-based browser with privacy-focused defaults"
packages = ["helium-browser-bin"]
command = "helium-browser-bin"

[[browsers]]
id = "librewolf"
name = "LibreWolf"
description = "Firefox without telemetry, focused on privacy"
packages = ["librewolf"]

[[browsers]]
id = "microsoft-edge"
name = "Microsoft Edge"
description = "Microsoft Chromium browser; largest package"
packages = ["microsoft-edge-stable"]
command = "microsoft-edge-stable"

[[browsers]]
id = "qutebrowser"
name = "QuteBrowser"
