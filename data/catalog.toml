# ----------------------------------------------------------------- desktop ---
[[desktops]]
id = "budgie"
name = "Budgie"
description = "Desktop tradisional modern, mode Wayland via Budgie Labwc"
packages = ["@budgie-desktop"]
autologin_cmd = "startbudgielabwc"

[[desktops]]
id = "hyprland"
name = "Hyprland"
description = "Tiling dinamis, config minimal tanpa bar"
packages = ["hyprland", "hyprland-guiutils", "hyprland-uwsm", "xdg-desktop-portal-hyprland", "hyprland-preview-share-picker"]
skel = "hyprland"
session_file = "hyprland-uwsm.desktop"
autologin_cmd = "Hyprland"
default = true

[[desktops]]
id = "kineticwe"
name = "KineticWE"
description = "Tiling berbasis KWin, shell Noctalia"
packages = ["kineticwe-git"]
login_override = "kineticwe-greeter"
autologin_cmd = "start-kineticwe"

[[desktops]]
id = "lxqt"
name = "LXQt"
description = "Desktop ringan, sesi Wayland lewat Miriway"
packages = ["@lxqt-desktop"]
autologin_cmd = "startlxqtwayland"

[[desktops]]
id = "mangowm"
name = "MangoWM"
description = "Tiling ringan berbasis dwl (wlroots)"
packages = ["mangowm", "scenefx", "wlroots", "xcb-util-wm", "xdg-desktop-portal-wlr", "slurp"]
skel = "mango"
autologin_cmd = "mango"

[[desktops]]
id = "niri"
name = "Niri"
description = "Scrollable tiling, config minimal tanpa bar"
packages = ["niri"]
skel = "niri"
autologin_cmd = "niri-session"

[[desktops]]
id = "sway"
name = "Sway"
description = "Tiling Wayland ringan, config skel belum disediakan"
packages = ["@swaywm"]
autologin_cmd = "sway"

[[desktops]]
id = "umbriel"
name = "Umbriel"
description = "Compositor Wayland ringan (paket Mindset-Apps, build git harian)"
packages = ["umbriel-git"]
autologin_cmd = "start-umbriel"

