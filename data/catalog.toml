# Katalog rakuos-bootstrap.
#
# Menambah/mengubah pilihan cukup edit file ini; binary tidak perlu di-rebuild.
# `available = false` menyembunyikan pilihan dari daftar (belum ada paketnya).
# `default = true` menentukan pilihan yang disorot saat fase dibuka.
#
# Urutan tampilan selalu A-Z (diurutkan ulang oleh kode), jadi urutan di file
# ini tidak menentukan urutan di layar. Tetap ditulis A-Z supaya enak dibaca.
#
# Semua paket di bawah sudah dicek ada di Fedora 45 atau repo RakuOS 45
# (2026-10-26).

# Repo pihak ketiga yang diaktifkan sebelum paket dipasang.
#
# Image RakuOS membawa Terra dan RPM Fusion dalam keadaan nonaktif. Wizard
# menyalakannya hanya kalau user memintanya, dengan cara yang sama seperti
# halaman "Third-Party Repositories" di rakuos-welcome:
#   terra     -> `rum config-manager --set-enabled terra`
#   rpmfusion -> id yang tercatat di /usr/share/rakuos/rpmfusion-default-repos,
#                fallback `rpmfusion-*`
# Kosongkan daftar ini kalau tidak ingin repo pihak ketiga disentuh.
repos = ["terra", "rpmfusion"]

# Lapisan dasar: selalu dipasang, apa pun pilihan user.
base = [
    "dbus-daemon",
    "egl-wayland",
]

# ---------------------------------------------------------------- terminal ---
[[terminals]]
id = "alacritty"
name = "Alacritty"
description = "GPU-accelerated, konfigurasi YAML sederhana"
packages = ["alacritty"]

[[terminals]]
id = "foot"
name = "Foot"
description = "Ringan, Wayland-only, cocok untuk sistem minimal"
packages = ["foot", "foot-terminfo"]

[[terminals]]
id = "ghostty"
name = "Ghostty"
description = "Dari repo Terra, diaktifkan otomatis saat instalasi"
packages = ["ghostty", "ghostty-terminfo", "ghostty-shell-integration"]

[[terminals]]
id = "kitty"
name = "Kitty"
description = "GPU-accelerated, paling umum dipakai di Hyprland"
packages = ["kitty", "kitty-kitten", "kitty-shell-integration", "kitty-terminfo"]
default = true

# ----------------------------------------------------------------- browser ---
[[browsers]]
id = "brave"
name = "Brave"
description = "Chromium dengan pemblokir iklan bawaan"
packages = ["brave-browser"]

[[browsers]]
id = "chromium"
name = "Chromium"
description = "Open source, tanpa sinkronisasi akun Google"
packages = ["chromium"]

[[browsers]]
id = "epiphany"
name = "Epiphany"
description = "GNOME Web (WebKitGTK), paling ringan"
packages = ["epiphany"]

[[browsers]]
id = "falkon"
name = "Falkon"
description = "Qt/Chromium ringan, cocok sistem minimal"
packages = ["falkon"]

[[browsers]]
id = "firefox"
name = "Firefox"
description = "Default, cepat, dan paling kompatibel"
packages = ["firefox"]
default = true

[[browsers]]
id = "google-chrome"
name = "Google Chrome"
description = "Proprietary, sinkronisasi akun Google"
packages = ["google-chrome-stable"]

[[browsers]]
id = "helium"
name = "Helium"
description = "Chromium privat dan cepat, dari Terra"
packages = ["helium-browser-bin"]

[[browsers]]
id = "librewolf"
name = "LibreWolf"
description = "Firefox tanpa telemetri, fokus privasi"
packages = ["librewolf"]

[[browsers]]
id = "microsoft-edge"
name = "Microsoft Edge"
description = "Chromium Microsoft, paket paling besar"
packages = ["microsoft-edge-stable"]

[[browsers]]
id = "qutebrowser"
name = "QuteBrowser"
description = "Keyboard-only, Qt/Python"
packages = ["qutebrowser"]

[[browsers]]
id = "vivaldi"
name = "Vivaldi"
description = "Fitur banyak, proprietary"
packages = ["vivaldi-stable"]

[[browsers]]
id = "waterfox"
name = "Waterfox"
description = "Firefox fork, fokus privasi"
packages = ["waterfox"]

[[browsers]]
id = "zen-browser"
name = "Zen Browser"
description = "Firefox fork, vertical tabs, dari Terra"
packages = ["zen-browser"]

# ----------------------------------------------------------------- desktop ---
[[desktops]]
id = "hyprland"
name = "Hyprland"
description = "Tiling dinamis, config minimal tanpa bar"
packages = ["hyprland", "hyprland-guiutils", "hyprland-uwsm", "xdg-desktop-portal-hyprland", "hyprland-preview-share-picker"]
skel = "hyprland"
session_file = "hyprland-uwsm.desktop"
autologin_cmd = "Hyprland"
default = true

[[desktops]]
id = "kineticwe"
name = "KineticWE"
description = "Tiling berbasis KWin, shell Noctalia"
packages = ["kineticwe-git"]
autologin_cmd = "start-kineticwe"

[[desktops]]
id = "mangowm"
name = "MangoWM"
description = "Tiling ringan berbasis dwl (wlroots)"
packages = ["mangowm", "scenefx", "wlroots", "xorg-x11-server-Xwayland", "xdg-desktop-portal-wlr"]
autologin_cmd = "mango"

[[desktops]]
id = "niri"
name = "Niri"
description = "Scrollable tiling, config minimal tanpa bar"
packages = ["niri", "xdg-desktop-portal-gnome"]
skel = "niri"
autologin_cmd = "niri-session"

# ------------------------------------------------------------ file manager ---
[[file_managers]]
id = "dolphin"
name = "Dolphin"
description = "File manager KDE, fitur lengkap (menarik Qt/KDE stack)"
packages = ["dolphin"]

[[file_managers]]
id = "hyprfm"
name = "HyprFM"
description = "Keyboard-first untuk Hyprland, dari repo RakuOS"
packages = ["hyprfm"]

[[file_managers]]
id = "nautilus"
name = "Nautilus"
description = "File manager GNOME, ringan untuk pemakaian dasar"
packages = ["nautilus"]
default = true

[[file_managers]]
id = "nemo"
name = "Nemo"
description = "File manager Cinnamon, GTK3, dukungan gvfs-fuse"
packages = ["nemo"]

[[file_managers]]
id = "superfile"
name = "Superfile"
description = "File manager TUI modern (binary spf), dari repo Terra"
packages = ["superfile"]

[[file_managers]]
id = "thunar"
name = "Thunar"
description = "File manager Xfce, ringan dan cepat"
packages = ["Thunar", "thunar-volman"]

[[file_managers]]
id = "yazi"
name = "Yazi"
description = "File manager TUI cepat, dari repo Terra"
packages = ["yazi"]

# ------------------------------------------------------------------- login ---
[[logins]]
id = "cosmic-greeter"
name = "COSMIC Greeter"
description = "Greeter COSMIC (greetd), butuh stack"
packages = ["cosmic-greeter"]
unit = "cosmic-greeter.service"

[[logins]]
id = "dms-greeter"
name = "DMS Greeter"
description = "Greeter Dux Shell (greetd), butuh quickshell"
packages = ["greetd", "dms-greeter"]
unit = "greetd.service"
greetd_cmd = "/usr/bin/dms-greeter --command @COMPOSITOR@"
greetd_user = "greeter"

[[logins]]
id = "gdm"
name = "GDM"
description = "GNOME Display Manager, sudah ada di base image"
packages = ["gdm"]
unit = "gdm.service"

[[logins]]
id = "greetd-tuigreet"
name = "greetd + tuigreet"
description = "Greeter TUI paling ringan, cocok Wayland"
packages = ["greetd", "tuigreet"]
unit = "greetd.service"
greetd_cmd = "/usr/bin/tuigreet --time --remember --remember-session --sessions /usr/share/wayland-sessions"
greetd_user = "greetd"
default = true

[[logins]]
id = "lightdm-slick"
name = "LightDM"
description = "Greeter Slick (GTK), sesi Wayland tetap bisa"
packages = ["lightdm", "slick-greeter"]
unit = "lightdm.service"
greeter = "slick-greeter"

[[logins]]
id = "ly"
name = "Ly"
description = "Display manager TUI, ringan"
packages = ["ly"]
unit = "ly.service"

[[logins]]
id = "noctalia-greeter"
name = "Noctalia Greeter"
description = "Greeter minimal Noctalia (greetd, wlroots)"
packages = ["greetd", "noctalia-greeter"]
unit = "greetd.service"
greetd_cmd = "/usr/bin/noctalia-greeter-session"
greetd_user = "greeter"

[[logins]]
id = "plasma-login"
name = "Plasma Login"
description = "Greeter KDE modern (pengganti SDDM)"
packages = ["plasma-login-manager"]
unit = "plasmalogin.service"

[[logins]]
id = "sddm"
name = "SDDM"
description = "Display manager grafis, paling familiar"
packages = ["sddm"]
unit = "sddm.service"

[[logins]]
id = "none"
name = "Tanpa login manager"
description = "Autologin user langsung ke desktop di tty1"
