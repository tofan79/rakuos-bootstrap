[package]
name = "rakuos-bootstrap"
version = "0.5.1"
edition = "2024"
description = "Post-install setup wizard for RakuOS minimal images (desktop, apps, and login manager)"
license = "MIT"
authors = ["tofan79 <nanasmuda.404@outlook.co.id>"]
repository = "https://github.com/tofan79/rakuos-bootstrap"
readme = "README.md"
keywords = ["rakuos", "fedora", "wayland", "installer", "tui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
console = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
strip = true
lto = true
opt-level = "s"
