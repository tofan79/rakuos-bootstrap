[package]
name = "rakuos-bootstrap"
version = "0.2.2"
edition = "2021"
description = "Wizard pasca-install untuk RakuOS minimal (terminal, browser, desktop, file manager, login manager)"
license = "MIT"

[dependencies]
anyhow = "1"
console = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
strip = true
lto = true
opt-level = "s"
